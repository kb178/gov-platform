# 消息服务配置
server:
  port: 8085

spring:
  application:
    name: gov-message
  # 导入 Nacos 配置（Spring Boot 3.x 必须）
  config:
    import: optional:nacos:
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gov_message?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: password
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 3

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  file:
    path: ./logs
  level:
    com.haikou: debug
