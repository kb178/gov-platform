<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 海口政务服务</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .register-page {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 50%, #60A5FA 100%);
    }

    /* 左侧品牌区域 */
    .register-brand {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .register-brand::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      animation: float 15s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .brand-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .brand-subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 48px;
    }

    .brand-steps {
      text-align: left;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(10px);
    }

    .brand-steps h3 {
      font-size: 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .step-item:last-child {
      margin-bottom: 0;
    }

    .step-number {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
    }

    .step-text {
      font-size: 14px;
      opacity: 0.9;
    }

    /* 右侧注册表单 */
    .register-form-wrapper {
      width: 520px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .register-form {
      width: 100%;
      max-width: 400px;
    }

    .register-header {
      margin-bottom: 40px;
    }

    .register-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .register-header p {
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* 表单样式 */
    .input-group {
      position: relative;
    }

    .input-group .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-placeholder);
      font-size: 18px;
    }

    .input-group .form-input {
      padding-left: 40px;
    }

    .sms-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      padding: 0 16px;
      background: var(--primary-bg);
      color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sms-btn:hover {
      background: var(--primary-lighter);
    }

    /* 密码强度 */
    .password-strength {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
      transition: background 0.3s;
    }

    .strength-bar.active.weak { background: var(--danger); }
    .strength-bar.active.medium { background: var(--warning); }
    .strength-bar.active.strong { background: var(--success); }

    .strength-text {
      font-size: 12px;
      margin-top: 4px;
    }

    .strength-text.weak { color: var(--danger); }
    .strength-text.medium { color: var(--warning); }
    .strength-text.strong { color: var(--success); }

    /* 链接 */
    .form-links {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      justify-content: center;
    }

    .form-links a {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-links a:hover {
      color: var(--primary);
    }

    /* 底部协议 */
    .agreement {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .agreement a {
      color: var(--primary-light);
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .register-brand {
        display: none;
      }

      .register-form-wrapper {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .register-form-wrapper {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="register-page">
    <!-- 左侧品牌区域 -->
    <div class="register-brand">
      <div class="brand-content">
        <div class="brand-logo">🏛️</div>
        <h1 class="brand-title">海口政务服务</h1>
        <p class="brand-subtitle">注册账号，享受便捷政务服务</p>

        <div class="brand-steps">
          <h3>注册流程</h3>
          <div class="step-item">
            <div class="step-number">1</div>
            <div class="step-text">填写手机号获取验证码</div>
          </div>
          <div class="step-item">
            <div class="step-number">2</div>
            <div class="step-text">设置登录密码</div>
          </div>
          <div class="step-item">
            <div class="step-number">3</div>
            <div class="step-text">注册成功，开始使用</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧注册表单 -->
    <div class="register-form-wrapper">
      <div class="register-form">
        <div class="register-header">
          <h2>用户注册</h2>
          <p>注册后即可在线办理政务服务</p>
        </div>

        <form id="registerForm">
          <!-- 手机号 -->
          <div class="form-group">
            <label class="form-label">
              手机号 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">📱</span>
              <input type="tel" class="form-input" placeholder="请输入手机号" maxlength="11" id="phone">
            </div>
          </div>

          <!-- 验证码 -->
          <div class="form-group">
            <label class="form-label">
              验证码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">💬</span>
              <input type="text" class="form-input" placeholder="请输入验证码" maxlength="6" id="smsCode">
              <button type="button" class="sms-btn" onclick="sendSms(this)">获取验证码</button>
            </div>
          </div>

          <!-- 密码 -->
          <div class="form-group">
            <label class="form-label">
              设置密码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请设置8-20位密码" id="password" oninput="checkPasswordStrength()">
            </div>
            <div class="password-strength">
              <div class="strength-bar" id="bar1"></div>
              <div class="strength-bar" id="bar2"></div>
              <div class="strength-bar" id="bar3"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
          </div>

          <!-- 确认密码 -->
          <div class="form-group">
            <label class="form-label">
              确认密码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请再次输入密码" id="confirmPassword">
            </div>
          </div>

          <!-- 用户协议 -->
          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" id="agreement">
              <span>我已阅读并同意
                <a href="#">《用户服务协议》</a>
                和
                <a href="#">《隐私政策》</a>
              </span>
            </label>
          </div>

          <!-- 注册按钮 -->
          <button type="submit" class="btn btn-primary btn-lg btn-block">注 册</button>
        </form>

        <!-- 登录链接 -->
        <div class="form-links">
          <span>已有账号？</span>
          <a href="login.html">立即登录</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 发送验证码
    function sendSms(btn) {
      const phone = document.getElementById('phone').value;
      if (!phone || phone.length !== 11) {
        alert('请先输入正确的手机号');
        return;
      }

      let countdown = 60;
      btn.disabled = true;
      btn.textContent = countdown + 's后重试';

      const timer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = countdown + 's后重试';
        }
      }, 1000);
    }

    // 检查密码强度
    function checkPasswordStrength() {
      const password = document.getElementById('password').value;
      const bars = [
        document.getElementById('bar1'),
        document.getElementById('bar2'),
        document.getElementById('bar3')
      ];
      const strengthText = document.getElementById('strengthText');

      // 重置
      bars.forEach(bar => {
        bar.className = 'strength-bar';
      });
      strengthText.className = 'strength-text';
      strengthText.textContent = '';

      if (!password) return;

      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;

      let level = '';
      if (strength <= 1) {
        level = 'weak';
        strengthText.textContent = '密码强度：弱';
      } else if (strength <= 2) {
        level = 'medium';
        strengthText.textContent = '密码强度：中';
      } else {
        level = 'strong';
        strengthText.textContent = '密码强度：强';
      }

      for (let i = 0; i < Math.min(strength, 3); i++) {
        bars[i].classList.add('active', level);
      }
      strengthText.classList.add(level);
    }

    // 表单提交
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value;
      const smsCode = document.getElementById('smsCode').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreement = document.getElementById('agreement').checked;

      // 验证
      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }
      if (!smsCode) {
        alert('请输入验证码');
        return;
      }
      if (!password || password.length < 8) {
        alert('密码长度不能少于8位');
        return;
      }
      if (password !== confirmPassword) {
        alert('两次输入的密码不一致');
        return;
      }
      if (!agreement) {
        alert('请同意用户服务协议和隐私政策');
        return;
      }

      // 模拟注册成功
      alert('注册成功！');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
