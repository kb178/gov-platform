<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - 海口政务服务</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .forgot-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
      padding: 20px;
    }

    .forgot-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .forgot-header {
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
      padding: 40px;
      text-align: center;
      color: white;
    }

    .forgot-header .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
    }

    .forgot-header h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .forgot-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .forgot-body {
      padding: 40px;
    }

    /* 步骤指示器 */
    .steps {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
    }

    .step-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .step-item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border-light);
    }

    .step-item.active:not(:last-child)::after,
    .step-item.completed:not(:last-child)::after {
      background: var(--primary);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }

    .step-item.active .step-circle {
      background: var(--primary);
      color: white;
    }

    .step-item.completed .step-circle {
      background: var(--success);
      color: white;
    }

    .step-label {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .step-item.active .step-label {
      color: var(--primary);
      font-weight: 500;
    }

    /* 表单 */
    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-label .required {
      color: var(--danger);
    }

    .input-group {
      position: relative;
    }

    .input-group .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-placeholder);
      font-size: 18px;
    }

    .input-group .form-input {
      padding-left: 40px;
    }

    .sms-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      padding: 0 16px;
      background: var(--primary-bg);
      color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sms-btn:hover {
      background: var(--primary-lighter);
    }

    .sms-btn:disabled {
      background: var(--bg-hover);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .password-strength {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
      transition: background 0.3s;
    }

    .strength-bar.active.weak { background: var(--danger); }
    .strength-bar.active.medium { background: var(--warning); }
    .strength-bar.active.strong { background: var(--success); }

    .btn-block {
      width: 100%;
    }

    .form-links {
      text-align: center;
      margin-top: 24px;
    }

    .form-links a {
      color: var(--primary-light);
      font-size: 14px;
    }

    /* 成功页面 */
    .success-view {
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: var(--success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }

    .success-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .success-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .forgot-body {
        padding: 24px;
      }

      .steps {
        flex-direction: column;
        gap: 16px;
      }

      .step-item:not(:last-child)::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="forgot-page">
    <div class="forgot-card">
      <div class="forgot-header">
        <div class="icon">🔑</div>
        <h2>找回密码</h2>
        <p>通过手机号验证重置密码</p>
      </div>

      <div class="forgot-body">
        <!-- 步骤指示器 -->
        <div class="steps">
          <div class="step-item active" id="step1">
            <div class="step-circle">1</div>
            <div class="step-label">验证手机</div>
          </div>
          <div class="step-item" id="step2">
            <div class="step-circle">2</div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item" id="step3">
            <div class="step-circle">3</div>
            <div class="step-label">完成</div>
          </div>
        </div>

        <!-- 第一步：验证手机 -->
        <div class="form-section active" id="form-step1">
          <div class="form-group">
            <label class="form-label">
              手机号 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">📱</span>
              <input type="tel" class="form-input" placeholder="请输入注册时的手机号" maxlength="11" id="phone">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              验证码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">💬</span>
              <input type="text" class="form-input" placeholder="请输入验证码" maxlength="6" id="smsCode">
              <button type="button" class="sms-btn" id="sendSmsBtn" onclick="sendSms()">获取验证码</button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-block" onclick="verifyPhone()">下一步</button>

          <div class="form-links">
            <a href="login.html">返回登录</a>
          </div>
        </div>

        <!-- 第二步：设置密码 -->
        <div class="form-section" id="form-step2">
          <div class="form-group">
            <label class="form-label">
              新密码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请设置8-20位新密码" id="newPassword" oninput="checkStrength()">
            </div>
            <div class="password-strength">
              <div class="strength-bar" id="bar1"></div>
              <div class="strength-bar" id="bar2"></div>
              <div class="strength-bar" id="bar3"></div>
            </div>
            <div class="form-hint">密码需包含字母和数字，长度8-20位</div>
          </div>

          <div class="form-group">
            <label class="form-label">
              确认新密码 <span class="required">*</span>
            </label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请再次输入新密码" id="confirmPassword">
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-block" onclick="resetPassword()">重置密码</button>
        </div>

        <!-- 第三步：完成 -->
        <div class="form-section" id="form-step3">
          <div class="success-view">
            <div class="success-icon">✅</div>
            <div class="success-title">密码重置成功！</div>
            <div class="success-desc">您的密码已成功重置，请使用新密码登录</div>
            <div class="success-actions">
              <a href="login.html" class="btn btn-primary btn-lg">立即登录</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let countdown = 60;
    let timer = null;

    // 发送验证码
    function sendSms() {
      const phone = document.getElementById('phone').value;
      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }

      const btn = document.getElementById('sendSmsBtn');
      btn.disabled = true;
      btn.textContent = countdown + 's后重试';

      timer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
          countdown = 60;
        } else {
          btn.textContent = countdown + 's后重试';
        }
      }, 1000);

      // 模拟发送成功
      alert('验证码已发送到您的手机');
    }

    // 验证手机号
    function verifyPhone() {
      const phone = document.getElementById('phone').value;
      const smsCode = document.getElementById('smsCode').value;

      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }

      if (!smsCode || smsCode.length !== 6) {
        alert('请输入验证码');
        return;
      }

      // 切换到第二步
      document.getElementById('form-step1').classList.remove('active');
      document.getElementById('form-step2').classList.add('active');
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step1').classList.add('completed');
      document.getElementById('step1').querySelector('.step-circle').textContent = '✓';
      document.getElementById('step2').classList.add('active');
    }

    // 检查密码强度
    function checkStrength() {
      const password = document.getElementById('newPassword').value;
      const bars = [
        document.getElementById('bar1'),
        document.getElementById('bar2'),
        document.getElementById('bar3')
      ];

      bars.forEach(bar => bar.className = 'strength-bar');

      if (!password) return;

      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;

      const level = strength <= 1 ? 'weak' : strength <= 2 ? 'medium' : 'strong';

      for (let i = 0; i < Math.min(strength, 3); i++) {
        bars[i].classList.add('active', level);
      }
    }

    // 重置密码
    function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || newPassword.length < 8) {
        alert('密码长度不能少于8位');
        return;
      }

      if (newPassword !== confirmPassword) {
        alert('两次输入的密码不一致');
        return;
      }

      // 切换到第三步
      document.getElementById('form-step2').classList.remove('active');
      document.getElementById('form-step3').classList.add('active');
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step2').classList.add('completed');
      document.getElementById('step2').querySelector('.step-circle').textContent = '✓';
      document.getElementById('step3').classList.add('active');
    }
  </script>
</body>
</html>
