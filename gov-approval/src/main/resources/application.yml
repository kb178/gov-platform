server:
  port: 8083

spring:
  application:
    name: gov-approval
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gov_approval?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: gov-platform
      config:
        server-addr: 127.0.0.1:8848
        namespace: gov-platform
        file-extension: yml

# Flowable 配置
flowable:
  database-schema-update: true
  async-executor-activate: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.haikou.government.approval.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.haikou.government: debug
    org.flowable: info
